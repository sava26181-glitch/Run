name: Build APK + IPA

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done; ls

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/MotoStunt.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MotoStunt-apk
          path: out/MotoStunt.apk

  ios:
    name: iOS IPA
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project zip
        run: for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z"; done; ls

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cp app/src/main/assets/index.html ios/MotoStunt/index.html
          cd ios && xcodegen generate

      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project MotoStunt.xcodeproj -scheme MotoStunt -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MotoStunt.app Payload/
          zip -qry MotoStunt.ipa Payload
          mkdir -p ../out && cp MotoStunt.ipa ../out/

      - uses: actions/upload-artifact@v4
        with:
          name: MotoStunt-ipa
          path: out/MotoStunt.ipa

  release:
    name: Release (APK + IPA)
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Мото Стант — сборка ${{ github.run_number }}
          body: |
            📱 **MotoStunt.apk** — Android: скачать и установить.
            🍏 **MotoStunt.ipa** — iPhone: установить через Sideloadly / AltStore.
          files: |
            dist/MotoStunt.apk
            dist/MotoStunt.ipa